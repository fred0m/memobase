llm_api_key: "sk-5ea79120836aa582-lxsk46-fd59ea69"
llm_base_url: "http://9router.momo/v1"
best_llm_model: "memobase-use"

# 单用户场景，关闭事件 embedding
enable_event_embedding: true
# 事件 embedding：硅基流动 Qwen3-Embedding-4B（MRL 截 1536 匹配 vector(1536) 列）
embedding_dim: 1536
embedding_model: "Qwen/Qwen3-Embedding-4B"
embedding_base_url: "https://api.siliconflow.cn/v1"
embedding_api_key: "sk-cjymqntpgfqboimbjlbhslhpgvvwrwpcgsxrlgsxadsarbrf"

# 中文语言
language: zh

# 自定义用户画像维度
overwrite_user_profiles:
  - topic: "basic_info"
    description: "用户基本资料"
    sub_topics:
      - name: "name"
        description: "用户的名称或昵称"
      - name: "age"
      - name: "gender"
      - name: "occupation"
        description: "用户的工作或专业"
      - name: "location"
      - name: "languages"
        description: "用户使用的语言"
      - name: "timezone"
        description: "用户所在时区"
  
  - topic: "interest"
    description: "用户的兴趣和偏好"
    sub_topics:
      - name: "tech_interests"
        description: "技术方面的兴趣方向"
      - name: "ai_topics"
        description: "AI 工具和模型的偏好"
      - name: "hobbies"
        description: "其他兴趣爱好"
  
  - topic: "psychological"
    description: "用户的心理特征和状态"
    sub_topics:
      - name: "goals"
        description: "用户的目标和愿望"
      - name: "personality_traits"
        description: "性格特点描述"
      - name: "preferences"
        description: "对 AI 互动的偏好（风格、语气等）"
